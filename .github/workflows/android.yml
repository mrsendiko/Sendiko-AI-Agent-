name: SENDIKO AI AGENT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Ekstrak aplikasi
        run: |
          echo "Memeriksa file proyek"
          ls -lah

          test -f aplikasi.zip || {
            echo "ERROR: aplikasi.zip tidak ditemukan"
            exit 1
          }

          mkdir -p /tmp/sendiko
          unzip -o aplikasi.zip -d /tmp/sendiko

          if [ -d /tmp/sendiko/app ]; then
            cp -r /tmp/sendiko/app .
          elif [ -d /tmp/sendiko/src ]; then
            mkdir -p app
            cp -r /tmp/sendiko/. app/
          else
            echo "ERROR: Struktur folder app tidak ditemukan"
            find /tmp/sendiko -maxdepth 3 -type f
            exit 1
          fi

          test -f app/build.gradle.kts || {
            echo "ERROR: app/build.gradle.kts tidak ditemukan"
            exit 1
          }

          echo "Folder app siap"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SENDIKO-AI-AGENT-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
