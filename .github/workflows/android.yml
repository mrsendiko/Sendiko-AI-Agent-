name: Build SENDIKO AI AGENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ekstrak aplikasi
        run: |
          if [ -f aplikasi.zip ]; then
            unzip -o aplikasi.zip
          fi

      - name: Build APK
        run: gradle assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: SENDIKO-AI-AGENT-APK
          path: app/build/outputs/apk/debug/*.apk
